name: Publish Portal Comfy Worker

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "portal-comfy-worker/**"
      - ".github/workflows/portal-comfy-worker.yml"
  push:
    branches: [main]
    tags: ["worker-v*"]
    paths:
      - "portal-comfy-worker/**"
      - ".github/workflows/portal-comfy-worker.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jakob-plappert/portal-comfy-worker
          tags: |
            type=raw,value=0.6.0
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: portal-comfy-worker
          file: portal-comfy-worker/Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
