[package]
name = "portal"
version = "0.8.0"
edition = "2024"
build = "build.rs"

[dependencies]
arboard = { version = "3.6", default-features = false }
slint = "1.18"
base64 = "0.23"
keyring = "4.2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
ureq = { version = "3.4", features = ["json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
slint-build = "1.18"
